<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #FAF9F5;
            padding: 40px;
        }
        h1 { font-size: 36px; margin-bottom: 20px; }
        p { font-size: 16px; color: #64748b; margin-bottom: 40px; }

        .chatbot-toggle {
            position: fixed; bottom: 24px; right: 24px;
            background: #EAB308; color: #0F172A;
            border: 3px solid #0F172A; border-radius: 50px;
            padding: 14px 22px; font-weight: 700; font-size: 15px;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
            box-shadow: 4px 4px 0px #0F172A; z-index: 999;
        }
        .chatbot-toggle:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #0F172A; }

        .chatbot-window {
            position: fixed; bottom: 24px; right: 24px;
            width: 420px; max-height: 620px;
            background: #FAF9F5; border: 3px solid #0F172A;
            border-radius: 16px; box-shadow: 8px 8px 0px #0F172A;
            display: none; flex-direction: column; z-index: 999;
        }
        .chatbot-window.open { display: flex; }

        .chatbot-header {
            background: #0F172A; color: #FAF9F5;
            padding: 14px 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 13px 13px 0 0;
        }
        .chatbot-header h3 { margin: 0; font-size: 16px; }
        .close-btn {
            background: transparent; border: none; color: #FAF9F5;
            font-size: 24px; cursor: pointer;
        }

        /* Language Selector */
        .lang-bar {
            display: flex; gap: 4px; padding: 8px 12px;
            background: #fff; border-bottom: 2px dashed #0F172A;
        }
        .lang-btn {
            flex: 1; padding: 6px; border: 2px solid #0F172A;
            background: white; border-radius: 6px; cursor: pointer;
            font-size: 12px; font-weight: 600; transition: all 0.15s;
        }
        .lang-btn.active {
            background: #EAB308; box-shadow: 2px 2px 0px #0F172A;
        }
        .lang-btn:hover:not(.active) { background: #f1f5f9; }

        .chatbot-messages {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 12px; max-height: 400px;
        }
        .message { display: flex; gap: 8px; max-width: 85%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: #EAB308; display: flex; align-items: center;
            justify-content: center; font-size: 16px; flex-shrink: 0;
        }
        .message.user .message-avatar { background: #0F172A; color: #FAF9F5; }
        .message-content {
            background: white; padding: 10px 14px;
            border: 2px solid #0F172A; border-radius: 12px;
            font-size: 14px; line-height: 1.5;
        }
        .message.user .message-content { background: #EAB308; }

        .detected-lang {
            font-size: 10px; color: #64748b; margin-top: 4px;
            font-style: italic;
        }

        .action-btn {
            background: #0F172A; color: #EAB308;
            border: 2px solid #0F172A; padding: 8px 14px;
            border-radius: 8px; font-weight: 700; font-size: 12px;
            cursor: pointer; margin-top: 8px; display: inline-block;
        }
        .action-btn:hover { background: #EAB308; color: #0F172A; }

        .chatbot-input {
            display: flex; gap: 8px; padding: 12px;
            background: white; border-top: 2px solid #0F172A;
            border-radius: 0 0 13px 13px;
        }
        .chatbot-input input {
            flex: 1; border: 2px solid #0F172A; border-radius: 8px;
            padding: 8px 12px; font-size: 14px; outline: none;
        }
        .chatbot-input button {
            background: #EAB308; border: 2px solid #0F172A;
            border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 700;
        }
    </style>
</head>
<body>
    <h1>🤖 Navigation Chatbot</h1>
    <p>Click the yellow "Need help?" button to test the chatbot. Try typing in English, Hindi, or Punjabi!</p>

    <button class="chatbot-toggle" onclick="toggleChatbot()">💬 Need help?</button>

    <div class="chatbot-window" id="chatbotWindow">
        <div class="chatbot-header">
            <h3>🤖 Navigation Assistant</h3>
            <button class="close-btn" onclick="toggleChatbot()"></button>
        </div>

        <!-- Language Selector -->
        <div class="lang-bar">
            <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">English</button>
            <button class="lang-btn" data-lang="hi" onclick="setLanguage('hi')">हिंदी</button>
            <button class="lang-btn" data-lang="pa" onclick="setLanguage('pa')">ਪੰਜਾਬੀ</button>
        </div>

        <div class="chatbot-messages" id="chatbotMessages"></div>

        <div class="chatbot-input">
            <input type="text" id="userInput" placeholder="Ask me anything..." onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // 🌍 Current language
        let currentLang = 'en';

        // 🔤 Auto-detect language from script
        function detectLanguage(text) {
            // Devanagari (Hindi)
            if (/[\u0900-\u097F]/.test(text)) return 'hi';
            // Gurmukhi (Punjabi)
            if (/[\u0A00-\u0A7F]/.test(text)) return 'pa';
            return 'en';
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            // Clear chat and show welcome in new language
            document.getElementById('chatbotMessages').innerHTML = '';
            addMessage(getWelcomeMessage(), 'bot');
        }

        function toggleChatbot() {
            const win = document.getElementById('chatbotWindow');
            const isOpen = win.classList.toggle('open');
            if (isOpen && document.getElementById('chatbotMessages').children.length === 0) {
                addMessage(getWelcomeMessage(), 'bot');
            }
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            // Auto-detect language from user's input
            const detectedLang = detectLanguage(message);
            const responseLang = detectedLang !== 'en' ? detectedLang : currentLang;

            addMessage(message, 'user', null, detectedLang !== 'en' ? detectedLang : null);
            input.value = '';

            setTimeout(() => {
                const response = getResponse(message, responseLang);
                addMessage(response.reply, 'bot', response.action);
            }, 400);
        }

        function addMessage(content, sender, action = null, detectedLang = null) {
            const messagesDiv = document.getElementById('chatbotMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const avatar = sender === 'user' ? '👤' : '🤖';
            let html = `<div class="message-avatar">${avatar}</div><div><div class="message-content">${content}`;

            if (action) {
                html += `<br><button class="action-btn" onclick="alert('Navigate to: ${action.path}')">${action.label} →</button>`;
            }
            html += `</div>`;

            if (detectedLang && sender === 'user') {
                const langNames = { hi: '🇮🇳 Hindi', pa: '🇮🇳 Punjabi', en: '🇬🇧 English' };
                html += `<div class="detected-lang">Detected: ${langNames[detectedLang]}</div>`;
            }

            html += `</div>`;
            messageDiv.innerHTML = html;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function getResponse(message, lang) {
            const msg = message.toLowerCase();

            // Check for calculations
            if (KB.calculate.keywords.some(k => msg.includes(k))) {
                const match = msg.match(/(\d+(?:\.\d+)?)\s*(acre|acres|एकड़|ਏਕੜ)/i);
                const acres = match ? parseFloat(match[1]) : null;
                const fn = KB.calculate[lang] || KB.calculate.en;
                return { reply: fn(acres) };
            }

            // Check all other entries
            for (const [key, entry] of Object.entries(KB)) {
                if (key === 'default' || key === 'calculate') continue;
                if (entry.keywords.some(k => msg.includes(k.toLowerCase()))) {
                    const reply = entry[lang] || entry.en;
                    return { reply, action: entry.action };
                }
            }

            // Default
            return { reply: KB.default[lang] || KB.default.en };
        }
